name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - master
      # Pre-release already runs the full build for this branch and publishes
      # the result, so CI would only duplicate it -- doubling build time and
      # the chances of hitting a flaky arm64 runner.
      - features/burai-zenin
    tags-ignore:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.ref }}
